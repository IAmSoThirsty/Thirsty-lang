# Pre-commit hooks for Thirsty-Lang
# Installation: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Trailing whitespace and end-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Black code formatter
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.11

  # Ruff linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]

  # YAML formatter
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        types_or: [yaml]
        additional_dependencies: ["prettier@3.9.6"]

  # Custom hooks (optional — requires Python scripts in scripts/ dir)
  # Validate pyproject.toml and entry points manually with:
  #   python -m py_compile pyproject.toml
  #   grep "thirsty.*:main" pyproject.toml  # verify all 6 scripts
